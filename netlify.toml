[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Fonction de publication (netlify/functions/publish.mjs). Variables d'environnement Netlify requises
# (à renseigner dans l'interface Netlify, jamais dans le dépôt) :
#   SUPABASE_URL, SUPABASE_ANON_KEY  adresse et clé anonyme du projet Supabase ;
#   BUILD_HOOK_URL                   adresse secrète du « build hook » qui relance la construction du site.
# Ce dossier ne contient que des fonctions (chaque fichier est déployé) : leurs tests sont dans netlify/tests.
[functions]
  directory = "netlify/functions"

# Netlify sert automatiquement dist/404.html (page 404 pré-rendue) pour les URL inconnues.

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Version en ligne : toujours relue, sinon l'écran « Publier » suivrait une réponse en cache.
[[headers]]
  for = "/version.json"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
